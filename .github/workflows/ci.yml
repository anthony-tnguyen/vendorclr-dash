name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Required status check. Everything here is cheap, static, and fast:
  # install, typecheck, lint, format, and the in-memory/unit Vitest suite.
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies from the committed Bun lockfile
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Check generated COI parser adapter
        run: bun run check:coi-parser-contract

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Run unit tests
        run: bun run test

  # Required status check, split out from `quality` because it exercises a
  # real Postgres (PGlite/WASM) rather than pure unit tests.
  #
  # Applies supabase/migrations to a real Postgres (PGlite/WASM) and asserts
  # the RLS tenancy boundary holds. No Docker or database service needed.
  # This is the only check that would catch a policy regression - a broken
  # RLS policy returns rows instead of raising, so nothing else notices.
  db-verify:
    name: db-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies from the committed Bun lockfile
        run: bun install --frozen-lockfile

      - name: Verify database schema and RLS policies
        run: bun run db:verify

  # Required status check. Builds the same Cloudflare-Worker-via-Nitro
  # production bundle GitHub Actions deploys (see
  # docs/operations/release-process.md for the deploy-owner decision), and
  # hands it to e2e-smoke so that job doesn't have to rebuild it.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies from the committed Bun lockfile
        run: bun install --frozen-lockfile

      - name: Build production bundle
        run: bun run build

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: production-bundle
          # .output is a dotdir - upload-artifact@v4's glob skips hidden files
          # unless told otherwise.
          include-hidden-files: true
          path: .output
          retention-days: 1

  # Required status check. Runs the full role-based browser suite from e2e/**
  # against the built production bundle. Task 0B added coverage for customer,
  # administrator, public-upload-error, empty, and permission-denied states
  # at desktop and mobile viewports, so this must now block regressions.
  #
  # Runs Playwright against the actual built Cloudflare Worker output
  # (via `wrangler dev`), not the Vite dev server - see playwright.config.ts.
  e2e-smoke:
    name: e2e-smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies from the committed Bun lockfile
        run: bun install --frozen-lockfile

      - name: Download production bundle
        uses: actions/download-artifact@v4
        with:
          name: production-bundle
          path: .output

      # wrangler dev's local workerd runtime does not forward the launching
      # shell's arbitrary OS environment into the Worker's process.env the
      # way a plain Node server would - only vars explicitly configured via
      # wrangler.json's `vars`, --var, or a .dev.vars file next to the
      # config reach the Worker. Setting these as a step-level `env:` alone
      # (as this workflow previously tried for UPLOAD_ABUSE_IP_HMAC_SECRET)
      # is silently ignored by workerd, so they have to land here instead,
      # confirmed empirically: with a .dev.vars file present, wrangler dev
      # picks it up; without one, it does not, regardless of the parent
      # shell's environment.
      #
      # VENDORCLEAR_SUPABASE_URL/VENDORCLEAR_SERVICE_ROLE_KEY point at the
      # vendorclr-staging Supabase project (ukbgjriqszthtgwxyirr) - the
      # service-role client resolveActiveUploadRequestByToken() uses to look
      # up a vendor-upload token, invalid or not, before this build's own
      # RLS-scoped credentials would ever come into play. Deliberately the
      # staging project, not production, since this job runs on every push.
      - name: Write .dev.vars for the local Worker runtime
        run: |
          cat <<VARS > .output/server/.dev.vars
          UPLOAD_ABUSE_IP_HMAC_SECRET=${{ secrets.UPLOAD_ABUSE_IP_HMAC_SECRET }}
          VENDORCLEAR_SUPABASE_URL=${{ secrets.VENDORCLEAR_SUPABASE_URL }}
          VENDORCLEAR_SERVICE_ROLE_KEY=${{ secrets.VENDORCLEAR_SERVICE_ROLE_KEY }}
          VARS

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      # Cached browser binaries skip the download, but the OS-level shared
      # libraries they need (installed by --with-deps above) live outside
      # that cache and must still be installed on every run.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run production-bundle browser flows
        run: bun run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
