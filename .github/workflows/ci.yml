name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies from the committed Bun lockfile
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      # Applies supabase/migrations to a real Postgres (PGlite/WASM) and asserts
      # the RLS tenancy boundary holds. No Docker or database service needed.
      # This is the only check that would catch a policy regression - a broken
      # RLS policy returns rows instead of raising, so nothing else notices.
      - name: Verify database schema and RLS policies
        run: bun run db:verify

      - name: Build production bundle
        run: bun run build
